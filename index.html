<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buybye - To buy something, you have to sell something">
    <title>Buybye - Buy & Sell Reimagined</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Carousel Container -->
    <div class="carousel-container">
        <!-- Slide 1 - Buy/Sell -->
        <div class="carousel-slide active" data-slide="1">
            <!-- Top Half - BUYING Section -->
            <section class="buying-section">
            </section>

            <!-- Bottom Half - SELLING Section -->
            <section class="selling-section">
            </section>
        </div>

        <!-- Slide 2 - We Flip and We Thrift -->
        <div class="carousel-slide" data-slide="2">
            <!-- Top Half -->
            <section class="buying-section slide2-top">
                <div class="content-wrapper">
                    <h1 class="section-title slide-message">We Flip</h1>
                    <p class="section-description">
                        Flip in Seconds, get instant credit
                    </p>
                </div>
            </section>

            <!-- Bottom Half -->
            <section class="selling-section slide2-bottom">
                <div class="content-wrapper">
                    <h1 class="section-title slide-message">We Thrift</h1>
                    <p class="section-description">
                        Choose from the biggest thrift inventory
                    </p>
                </div>
            </section>
        </div>

        <!-- Slide 3 - Economical and Ecological -->
        <div class="carousel-slide" data-slide="3">
            <!-- Top Half -->
            <section class="buying-section slide3-top">
                <div class="content-wrapper">
                    <h1 class="section-title slide-message">Economical</h1>
                    <p class="section-description">
                        Don't Spend just Avail
                    </p>
                </div>
            </section>

            <!-- Bottom Half -->
            <section class="selling-section slide3-bottom">
                <div class="content-wrapper">
                    <h1 class="section-title slide-message">Ecological</h1>
                    <p class="section-description">
                        For the Planet, Fr
                    </p>
                </div>
            </section>
        </div>
    </div>

    <!-- Central Message (only visible on slide 1) -->
    <div class="central-message">
        <div class="logo-container">
            <img src="images/logo.png" alt="Buybye Logo" class="logo", height= 30px>
            <div class="logo-text">
                <span class="logo-buy">Buy</span><span class="logo-bye">Bye</span>
            </div>
        </div>
        <h2 class="core-message">
            Make room. Make the move.<br>
            Give to Take.
        </h2>
    </div>

    <!-- Carousel Navigation Dots -->
    <div class="carousel-dots">
        <span class="dot active" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
        <span class="dot" data-slide="3"></span>
    </div>

    <!-- Floating Contact Button -->
    <a href="#contact" class="contact-button" id="contactBtn">
        Contact Us
    </a>

    <!-- Snackbar for notifications -->
    <div id="snackbar" class="snackbar"></div>

    <script src="script.js"></script>
</body>
</html>
