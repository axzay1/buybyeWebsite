<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buybye - To buy something, you have to sell something">
    <title>Buybye - Buy & Sell Reimagined</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Logo -->
    <div class="logo-container">
        <img src="images/buybye-logo.gif" alt="Buybye Logo" class="logo">
    </div>

    <!-- Top Half - BUYING Section -->
    <section class="buying-section">
        <div class="content-wrapper">
            <div class="icon-container">
                <span class="icon">🛍️</span>
                <span class="icon">✨</span>
                <span class="icon">💳</span>
            </div>
            <h1 class="section-title">Buy</h1>
            <p class="section-description">
                Discover new treasures, embrace excitement, and bring home what you love
            </p>
        </div>
    </section>

    <!-- Central Message -->
    <div class="central-message">
        <h2 class="core-message">
            To buy something, you have to sell something
        </h2>
    </div>

    <!-- Bottom Half - SELLING Section -->
    <section class="selling-section">
        <div class="content-wrapper">
            <div class="section-title-spacer"></div>
            <p class="section-description">
                Say "bye bye" to unused items, declutter your space, and make room for the new
            </p>
            <div class="icon-container">
                <span class="icon">👋</span>
                <span class="icon">📦</span>
                <span class="icon">💸</span>
            </div>
        </div>
    </section>

    <!-- Floating Contact Button -->
    <a href="#contact" class="contact-button" id="contactBtn">
        Contact Us
    </a>

    <script src="script.js"></script>
</body>
</html>
