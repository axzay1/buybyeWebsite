<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buybye - To buy something, you have to sell something">
    <title>Buybye - Buy & Sell Reimagined</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Half - BUYING Section -->
    <section class="buying-section">
        <div class="content-wrapper">
            <div class="icon-container">
                <span class="icon">🛍️</span>
                <span class="icon">✨</span>
                <span class="icon no-card">🚫💳</span>
            </div>
            <h1 class="section-title">Buy</h1>
            <p class="section-description">
                Discover new treasures, embrace excitement, and bring home what you love
            </p>
            <p class="no-card-text">No card required</p>
        </div>
    </section>

    <!-- Central Message -->
    <div class="central-message">
        <img src="images/buybye-logo.svg" alt="Buybye Logo" class="logo">
        <h2 class="core-message">
            Make room. Make the move.<br>
            Sell to buy.
        </h2>
    </div>

    <!-- Bottom Half - SELLING Section -->
    <section class="selling-section">
        <div class="content-wrapper">
            <div class="stamp-badge">
                SELL ANYTHING<br>IN 5 MINUTES
            </div>
            <h1 class="section-title hidden-preserve-layout">Sell</h1>
            <p class="section-description">
                Say "bye bye" to unused items, declutter your space, and make room for the new
            </p>
            <div class="icon-container">
                <span class="icon">👋</span>
                <span class="icon">📦</span>
                <span class="icon">💸</span>
            </div>
        </div>
    </section>

    <!-- Floating Contact Button -->
    <a href="#contact" class="contact-button" id="contactBtn">
        Contact Us
    </a>

    <!-- Snackbar for notifications -->
    <div id="snackbar" class="snackbar"></div>

    <script src="script.js"></script>
</body>
</html>
